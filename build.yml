name: Build Complexity APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Get the files
        uses: actions/checkout@v4

      - name: Find the project
        run: |
          # The project can arrive as project.zip, Project.zip, a file called just "project",
          # any other .zip, or already unpacked. Look for all of them, in the root first and
          # then one folder down.
          zipfile=""
          while IFS= read -r f; do
            if unzip -tq "$f" > /dev/null 2>&1; then zipfile="$f"; break; fi
          done < <(find . -maxdepth 2 -type f \( -iname 'project' -o -iname 'project.zip' -o -iname '*.zip' \) \
                     -not -path './.git/*' -not -path './.github/*' | awk '{ print length($0) " " $0 }' | sort -n | cut -d' ' -f2-)
          if [ -n "$zipfile" ]; then
            echo "Using $zipfile"
            unzip -q "$zipfile" -d assn_project
            found=$(find assn_project -maxdepth 3 -name settings.gradle | head -n 1)
            if [ -z "$found" ]; then
              echo "settings.gradle was not found inside $zipfile"
              exit 1
            fi
            echo "PROJECT_DIR=$(dirname "$found")" >> "$GITHUB_ENV"
          elif [ -f settings.gradle ]; then
            echo "PROJECT_DIR=." >> "$GITHUB_ENV"
          else
            echo "No project zip and no settings.gradle in the repository. Files found:"
            find . -maxdepth 2 -not -path './.git/*' | sort
            exit 1
          fi

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Prepare the Android SDK
        run: |
          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          cd "$PROJECT_DIR"
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          SM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SM" --licenses > /dev/null || true
          "$SM" --list 2>/dev/null | grep -o 'platforms;android-3[67][^ ]*' | sort -u || true
          P37=$("$SM" --list 2>/dev/null | grep -o 'platforms;android-37[^ ]*' | grep -v ext | sort -u | head -n 1)
          echo "Installing platform: $P37"
          "$SM" "$P37" "build-tools;36.0.0"
          ls "$ANDROID_HOME/platforms"

      - name: Build the APK
        run: |
          cd "$PROJECT_DIR"
          set +e
          gradle assembleDebug --no-daemon --console=plain --stacktrace > "$GITHUB_WORKSPACE/build.log" 2>&1
          code=$?
          set -e
          if [ $code -ne 0 ]; then
            cd "$GITHUB_WORKSPACE"
            {
              echo "### Build failed - the reason:"
              echo '```'
              grep -m1 -A14 "What went wrong" build.log
              grep -m30 "^e: " build.log
              echo '```'
            } > reason.txt
            cat reason.txt
            cat reason.txt >> "$GITHUB_STEP_SUMMARY"
            msg=$(grep -m1 -A6 "What went wrong" build.log | tr '\n' ' ' | cut -c1-600)
            echo "::error title=Why the build failed::$msg"
            exit 1
          fi

      - name: Keep the build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log

      - name: Name the APK
        run: cp "$PROJECT_DIR/app/build/outputs/apk/debug/app-debug.apk" Complexity.apk

      - name: Keep the APK as a download
        uses: actions/upload-artifact@v4
        with:
          name: Complexity-apk
          path: Complexity.apk

      - name: Publish the APK as a release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Complexity build ${{ github.run_number }}
          files: Complexity.apk
