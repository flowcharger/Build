name: Build Liquid Air APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Get the files
        uses: actions/checkout@v4

      - name: Find the project
        run: |
          if [ -f project.zip ]; then
            unzip -q project.zip -d assn_project
            found=$(find assn_project -maxdepth 3 -name settings.gradle | head -n 1)
            if [ -z "$found" ]; then
              echo "settings.gradle was not found inside project.zip"
              exit 1
            fi
            echo "PROJECT_DIR=$(dirname "$found")" >> "$GITHUB_ENV"
          elif [ -f settings.gradle ]; then
            echo "PROJECT_DIR=." >> "$GITHUB_ENV"
          else
            echo "No project.zip and no settings.gradle in the repository"
            exit 1
          fi

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Prepare the Android SDK
        run: |
          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          cd "$PROJECT_DIR"
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0" > /dev/null || true

      - name: Build the APK
        run: |
          cd "$PROJECT_DIR"
          set +e
          gradle assembleDebug --no-daemon --console=plain --stacktrace > "$GITHUB_WORKSPACE/build.log" 2>&1
          code=$?
          set -e
          if [ $code -ne 0 ]; then
            cd "$GITHUB_WORKSPACE"
            {
              echo "### Build failed - the reason:"
              echo '```'
              grep -m1 -A14 "What went wrong" build.log
              grep -m30 "^e: " build.log
              echo '```'
            } > reason.txt
            cat reason.txt
            cat reason.txt >> "$GITHUB_STEP_SUMMARY"
            msg=$(grep -m1 -A6 "What went wrong" build.log | tr '\n' ' ' | cut -c1-600)
            echo "::error title=Why the build failed::$msg"
            exit 1
          fi

      - name: Keep the build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log

      - name: Name the APK
        run: cp "$PROJECT_DIR/app/build/outputs/apk/debug/app-debug.apk" LiquidAir.apk

      - name: Keep the APK as a download
        uses: actions/upload-artifact@v4
        with:
          name: LiquidAir-apk
          path: LiquidAir.apk

      - name: Publish the APK as a release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Liquid Air build ${{ github.run_number }}
          files: LiquidAir.apk
